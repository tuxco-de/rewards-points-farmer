<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Microsoft Rewards</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; }
      #shell { min-height: 360px; padding: 16px; }
      section { display: grid; gap: 12px; margin-bottom: 16px; }
      [role="link"], section a { border: 1px solid #ddd; color: inherit; display: block; padding: 12px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main id="shell" class="pg-content min-h-screen">
      <header>
        <h1>Microsoft Rewards</h1>
        <button type="button" aria-label="Close">Close</button>
      </header>

      <section aria-label="日常任务">
        <h2>日常任务</h2>
        <div>80/180</div>
        <div role="progressbar" aria-label="日常任务 的进度" aria-valuemin="0" aria-valuenow="44.444" aria-valuemax="100"></div>
      </section>

      <section id="dailyset">
        <h2>每日活动</h2>
        <a data-task-card href="https://www.bing.com/search?q=%E6%88%91%E9%99%84%E8%BF%91%E5%8D%B3%E5%B0%86%E4%B8%BE%E8%A1%8C%E7%9A%84%E6%B4%BB%E5%8A%A8">
          <img alt="我附近即将举行的活动" />
          <p>发现您所在地区即将举行的活动</p>
          <span>+10</span>
        </a>
        <a data-task-card aria-label="极速问答 已完成" href="https://www.bing.com/rewards/checkuser?task=quiz">
          <img alt="极速问答" />
          <p>参加今日测验</p>
          <span>+30</span>
        </a>
        <a data-task-card href="https://www.bing.com/rewards/checkuser?task=daily-poll">
          <img alt="每日投票" />
          <p>选择您的偏好</p>
          <span>+10</span>
        </a>
      </section>

      <section id="exploreonbing">
        <h2>在必应上浏览</h2>
        <div>0/40</div>
        <div role="progressbar" aria-label="在必应上浏览 的进度" aria-valuemin="0" aria-valuenow="0" aria-valuemax="100"></div>
        <span data-task-card role="link" tabindex="0" data-react-aria-pressable="true" data-task-id="beauty">
          <img alt="焕新您的日常​" />
          <p>在 Bing 上搜索您的下一个美容、护发或香水产品。</p>
          <span>+10</span>
        </span>
        <span data-task-card role="link" tabindex="0" data-react-aria-pressable="true" data-task-id="concert">
          <img alt="观看演出​" />
          <p>在 Bing 上搜索，查找您附近音乐会的门票</p>
          <span>+10</span>
        </span>
        <span data-task-card role="link" tabindex="0" data-react-aria-pressable="true" data-task-id="internet">
          <img alt="查看选项​" />
          <p>在 Bing 上搜索以比较您所在地区的互联网套餐</p>
          <span>+10</span>
        </span>
        <span data-task-card role="link" tabindex="0" data-react-aria-pressable="true" data-task-id="rental-car">
          <img alt="驾驭您的旅程​" />
          <p>在 Bing 上搜索租车，为您的下一次冒险做好准备</p>
          <span>+10</span>
        </span>
      </section>

      <section id="moreactivities">
        <h2>日常任务</h2>
        <a href="https://www.instagram.com/microsoftrewards">Instagram</a>
        <a href="https://www.tiktok.com/@microsoftrewards">TikTok</a>
        <a href="https://www.youtube.com/@microsoftrewards">YouTube</a>
      </section>
    </main>

    <script>
      if (new URLSearchParams(window.location.search).get('pointsComplete') === '1') {
        const progress = document.querySelector('[aria-label="日常任务 的进度"]');
        progress.setAttribute('aria-valuenow', '100');
        progress.previousElementSibling.textContent = '180/180';
        document.querySelectorAll('#dailyset a').forEach(link => link.setAttribute('aria-label', `${link.textContent} 已完成`));
      }
      document.querySelector('button[aria-label="Close"]').addEventListener('click', () => {
        window.parent.postMessage({ fixtureAction: 'close' }, 'https://www.bing.com');
      });
      document.querySelectorAll('[data-task-card]').forEach(card => {
        card.addEventListener('click', event => {
          event.preventDefault();
          window.parent.postMessage({
            fixtureAction: 'card-click',
            href: card.getAttribute('href') || card.getAttribute('data-task-id') || ''
          }, 'https://www.bing.com');
        });
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bing shell fixture</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }

      #b_header {
        align-items: center;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: flex-end;
        min-height: 56px;
        padding: 0 24px;
      }

      #content {
        min-height: 2200px;
        padding: 24px;
      }

      #b_rwFlyout,
      #rewid-f iframe {
        border: 0;
        height: 360px;
        position: absolute;
        right: 24px;
        top: 64px;
        width: 360px;
      }
    </style>
  </head>
  <body>
    <header id="b_header">
      <div id="id_rh">
        <a id="rewards-badge" class="points-container" role="button" href="javascript:document.body.dataset.javascriptNavigation='1'">Rewards 123</a>
      </div>
    </header>

    <main id="content">
      <form id="sb_form">
        <input id="sb_form_q" name="q" value="" />
        <button id="sb_form_go" type="submit">Search</button>
      </form>

      <section class="b_vList b_divsec">
        <a href="/search?q=weather">weather forecast</a>
        <a href="/search?q=technology">technology news</a>
      </section>

      <article class="b_algo">Example result</article>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const modernLayout = params.get('modernLayout') === '1';
      const pointsComplete = params.get('pointsComplete') === '1';
      const englishSummary = params.get('englishSummary') === '1';
      const completedChineseSummary = params.get('completedChineseSummary') === '1';
      const claimablePoints = params.get('claimablePoints') === '1';
      const hundredTotal = params.get('hundredTotal') === '1';
      const completedCard = params.get('completedCard') === '1';
      const reactiveAutocomplete = params.get('reactiveAutocomplete') === '1';
      const unconfiguredPromotion = params.get('unconfiguredPromotion') === '1';
      const unconfiguredEnglishPromotion = params.get('unconfiguredEnglishPromotion') === '1';
      const currentRewardsCards = params.get('currentRewardsCards') === '1';
      const spaSearch = params.get('spaSearch') === '1';
      const firstPromotionTitle = unconfiguredEnglishPromotion
        ? 'Plan your future'
        : (unconfiguredPromotion ? '规划你的未来' : '查找住宿地点');
      const firstPromotionDescription = unconfiguredEnglishPromotion
        ? 'Search Bing for personal and student loan options'
        : (unconfiguredPromotion
            ? '在 Bing 上搜索以比较个人和学生贷款选项'
            : '在 Bing 上搜索适合周末旅行的住宿地点');
      const searchProgress = pointsComplete
        ? (modernLayout ? '200 / 200' : '90 / 90')
        : (hundredTotal ? '0 / 100' : (modernLayout ? '0 / 200' : '0 / 90'));
      const legacyProgressMarkup = englishSummary
        ? `<div class="earned-summary">
             <p>You earned</p>
             <p>80 points already</p>
             <p>Keep searching to earn up to</p>
             <p>200 points today</p>
           </div>
           <div>
             <span>Other activity progress</span>
             <span>80 / 80</span>
           </div>`
        : `<div>
             <span>PC search progress</span>
             <span>${searchProgress}</span>
           </div>`;
      const legacyFlyoutMarkup = `
        <!doctype html>
        <html>
          <body>
            <section aria-label="Rewards panel">
              ${legacyProgressMarkup}

              <a class="rw-card" aria-label="Daily poll - 10 points" href="/search?q=https%3A%2F%2Fwww.bing.com%2Frewards">
                <span class="point" aria-label="10 points">+10</span>
                <span>Daily poll</span>
              </a>

              <a class="rw-card" aria-label="NASA Artemis mission - 10 points" href="/rewards/task/nasa-artemis">
                <span class="point" aria-label="10 points">+10</span>
                <span>NASA Artemis mission</span>
              </a>
            </section>
          </body>
        </html>`;
      const modernProgressMarkup = completedChineseSummary
        ? `<div class="earned-summary">
             <p>你已获得 200 积分！</p>
             <p>每天继续搜索并获得最多 200 奖励积分</p>
           </div>
           <div class="search_earn_card">
             <span>其他搜索任务</span>
             <span>0 / 70</span>
           </div>`
        : `<div class="search_earn_card">
             <span>每日搜索</span>
             <span>${searchProgress}</span>
           </div>`;
      const currentRewardsCardsMarkup = currentRewardsCards
        ? `<div class="promo_cont">
             <a class="block" href="https://www.bing.com/rewards/checkuser?task=daily-poll">
               <p class="promo-title">每日投票</p>
               <div class="shortPoint point">10</div>
               <div class="promo-desc">选择您的偏好，看看您与他人相比如何</div>
             </a>
           </div>
           <div class="promo_cont">
             <a class="block" href="https://rewards.bing.com/refer?form=ML2XHD">
               <p class="promo-title">将推荐转化为奖励</p>
               <div class="shortPoint point">10</div>
               <div class="promo-desc">当你的朋友在必应上搜索时，你可以赚取更多积分。</div>
             </a>
           </div>
           ${[
             ['更智能的银行服务\u200B', '在 Bing 上搜索以比较支票账户和储蓄账户选项'],
             ['观看演出\u200B', '在 Bing 上搜索，查找您附近音乐会的门票'],
             ['学习歌曲歌词\u200B', '在 Bing 上搜索您最喜欢的歌曲的歌词'],
             ['驾驭您的旅程\u200B', '在 Bing 上搜索租车，为您的下一次冒险做好准备'],
           ].map(([title, description]) => `
             <div id="exclusive_promo_cont" class="promo_cont">
               <a class="block" href="https://www.bing.com/?form=ML2PCR&amp;OCID=ML2PCR&amp;rwAutoFlyout=exb">
                 <p class="b_subtitle promo-title">${title}</p>
                 <div class="shortPoint point">10</div>
                 <div class="fp_row b_footnote promo-desc">${description}</div>
               </a>
             </div>`).join('')}
           <div class="promo_cont">
             <a class="block" href="https://www.bing.com/search?q=%E5%BB%89%E4%BB%B7%E6%9C%BA%E7%A5%A8&amp;form=TGREW6">
               <p class="promo-title">使用 Bing 预订航班</p>
               <div class="shortPoint point">5</div>
               <div class="promo-desc">发现您下次出行的最低票价</div>
             </a>
           </div>
           <div class="promo_cont">
             <a class="block" href="https://www.bing.com/rewards/checkuser?ru=%2Fsearch%3Fq%3DJazz%2Bmusic%26filters%3DBTROEC%253A%25220%2522%2BBTROMC%253A%252230%2522">
               <p class="promo-title">加速测验</p>
               <div class="shortPoint point">30</div>
               <div class="promo-desc">参加一个2分钟的奖励测验以赚取30分</div>
             </a>
           </div>
           <div class="promo_cont">
             <a class="block" href="https://www.bing.com/search?q=%E6%BD%9C%E6%B0%B4%E6%8A%80%E5%B7%A7&amp;form=ML2UYA&amp;rnoreward=1">
               <p class="promo-title">熟练潜水</p>
               <div class="shortPoint point">10</div>
               <div class="promo-desc">掌握安全且高效的潜水技巧</div>
             </a>
           </div>
           <div class="promo_cont">
             <a class="block" href="https://www.bing.com/search?q=DNA%E5%9C%A8%E7%BB%86%E8%83%9E%E4%B8%AD%E7%9A%84%E4%BD%9C%E7%94%A8&amp;form=ML2UYA&amp;rnoreward=1">
               <p class="promo-title">DNA解码</p>
               <div class="shortPoint point">10</div>
               <div class="promo-desc">了解DNA在细胞功能中的重要作用</div>
             </a>
           </div>`
        : '';
      const modernFlyoutMarkup = `
        <!doctype html>
        <html>
          <body>
            <main id="app" aria-label="Microsoft Rewards">
              <button type="button" data-flyout-close aria-label="Close">Close</button>
              <section class="flyout_exb_card">
                ${modernProgressMarkup}
                <div id="exb-activityChecklist">
                  <div class="promo_cont">
                    <a class="block" href="/search?q=https%3A%2F%2Fwww.bing.com%2Frewards">
                      <p class="promo-title">${firstPromotionTitle}</p>
                      <div class="shortPoint point" aria-label="10 积分">10</div>
                      <div class="promo-desc">${firstPromotionDescription}</div>
                    </a>
                  </div>
                  <div class="promo_cont" ${completedCard ? 'aria-label="NASA Artemis mission is completed"' : ''}>
                    <a class="block" href="/rewards/task/nasa-artemis">
                      <p class="promo-title">NASA Artemis mission</p>
                      <div class="shortPoint point" aria-label="10 积分">10</div>
                      <div class="promo-desc">Search Bing for NASA Artemis mission</div>
                    </a>
                  </div>
                </div>
                ${currentRewardsCardsMarkup}
                <div class="ss_items_wrapper">
                  <a class="ss_item" href="/search?q=summer+travel">summer travel</a>
                  <a class="ss_item" href="/search?q=technology+news">technology news</a>
                </div>
              </section>
            </main>
          </body>
        </html>`;

      const rewardsBadge = document.getElementById('rewards-badge');
      const searchForm = document.getElementById('sb_form');
      const searchInput = document.getElementById('sb_form_q');
      const searchButton = document.getElementById('sb_form_go');

      if (reactiveAutocomplete) {
        searchInput.addEventListener('input', () => {
          const inputEventCount = Number(document.body.dataset.inputEventCount || 0) + 1;
          document.body.dataset.inputEventCount = String(inputEventCount);
          if (inputEventCount < 2 || searchInput.value.length > 1) return;
          setTimeout(() => {
            searchInput.value = `stale-${searchInput.value}`;
          }, 0);
        });
      }

      if (claimablePoints) {
        const claimSection = document.createElement('section');
        claimSection.id = 'claimable-points';
        claimSection.innerHTML = `
          <button type="button" data-claim-control>Claim 10 points</button>
          <button type="button" data-claim-control>Claim now</button>
          <button type="button" data-claim-control>领取</button>
          <a href="/redeem" data-redeem-control>Redeem reward</a>`;
        claimSection.querySelectorAll('[data-claim-control]').forEach(control => {
          control.addEventListener('click', () => {
            document.body.dataset.claimedPoints = String(Number(document.body.dataset.claimedPoints || 0) + 1);
            control.remove();
          });
        });
        claimSection.querySelector('[data-redeem-control]').addEventListener('click', event => {
          event.preventDefault();
          document.body.dataset.redeemClicked = '1';
        });
        document.body.appendChild(claimSection);
      }

      if (modernLayout) {
        rewardsBadge.id = 'id_rh_w';
        rewardsBadge.className = '';
        rewardsBadge.setAttribute('role', 'button');
        rewardsBadge.setAttribute('aria-label', 'Microsoft Rewards');
        rewardsBadge.setAttribute('aria-controls', 'rewid-f');
        rewardsBadge.setAttribute('aria-expanded', 'false');
        searchForm.id = 'modern-search-form';
        searchForm.action = '/search';
        searchInput.id = 'modern-search-input';
        searchInput.type = 'search';
        searchInput.setAttribute('role', 'searchbox');
        searchButton.id = 'modern-search-submit';
      }

      rewardsBadge.addEventListener('click', () => {
        document.body.dataset.rewardsToggleCount = String(Number(document.body.dataset.rewardsToggleCount || 0) + 1);
        const existing = document.getElementById(modernLayout ? 'rewid-f' : 'b_rwFlyout');
        if (existing) {
          existing.remove();
          rewardsBadge.setAttribute('aria-expanded', 'false');
          return;
        }

        const iframe = document.createElement('iframe');
        if (modernLayout) {
          iframe.src = '/rewards/panelflyout?channel=bing';
          iframe.title = 'Microsoft Rewards, expanded';
        } else {
          iframe.id = 'b_rwFlyout';
        }
        iframe.srcdoc = modernLayout ? modernFlyoutMarkup : legacyFlyoutMarkup;
        iframe.addEventListener('load', () => {
          iframe.contentDocument.querySelector('[data-flyout-close]')?.addEventListener('click', () => {
            document.body.dataset.flyoutCloseCount = String(Number(document.body.dataset.flyoutCloseCount || 0) + 1);
            document.getElementById('rewid-f')?.remove();
            rewardsBadge.setAttribute('aria-expanded', 'false');
          });
          iframe.contentDocument.addEventListener('click', event => {
            const card = event.target.closest('.rw-card, .promo_cont a');
            if (!card) return;
            event.preventDefault();
            document.body.dataset.lastCardClick = card.getAttribute('href');
            document.body.dataset.cardClickCount = String(Number(document.body.dataset.cardClickCount || 0) + 1);
          });
        });
        if (modernLayout) {
          const flyout = document.createElement('div');
          flyout.id = 'rewid-f';
          flyout.setAttribute('role', 'dialog');
          flyout.appendChild(iframe);
          document.body.appendChild(flyout);
        } else {
          document.body.appendChild(iframe);
        }
        rewardsBadge.setAttribute('aria-expanded', 'true');
      });

      searchForm.addEventListener('submit', event => {
        event.preventDefault();
        document.body.dataset.lastQuery = searchInput.value;
        if (spaSearch) {
          document.body.dataset.spaSubmitCount = String(Number(document.body.dataset.spaSubmitCount || 0) + 1);
          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('q', searchInput.value);
          history.replaceState({}, '', nextUrl);
        }
      });
    </script>
  </body>
</html>
